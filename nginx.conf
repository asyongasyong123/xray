worker_processes auto;
worker_rlimit_nofile 10240;  # ✅ Qwiklabs safe limit

events {
    worker_connections 4096;  # ✅ Balanse, dili sobra
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 3600;  # ✅ Walay putol
    keepalive_requests 10000;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;

    server_tokens off;

    server {
        listen 8080;
        listen [::]:8080;

        # ✅ REQUIRED HEALTH CHECK — Cloud Run won't kill you
        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
            access_log off;
        }

        # ✅ Landing page (safe)
        location / {
            return 200 "✅ Service Running | Qwiklabs Ready";
            add_header Content-Type text/plain;
        }

        # ✅ Trojan WS — Perfect match
        location /tr-ws-xray {
            proxy_pass http://127.0.0.1:10001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # ✅ VLESS WS — Perfect match
        location /vl-ws-xray {
            proxy_pass http://127.0.0.1:10002;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }
    }
}
